# tygo configuration: generates the TypeScript wire types for the web client.
#
#   cd server && go tool tygo generate
#
# Output goes to ../web/src/lib/protocol/ (one file per Go package). CI runs the
# generator and fails when the checked-in files differ, so never edit them by hand.
#
# Conventions of the generated code:
#   * `omitempty` / `omitzero` fields become optional (`field?: T`).
#   * In internal/game, string enums whose constants are prefixed with the type
#     name (Phase, Lang, Status) become `export const PhaseLobby = "lobby"` plus
#     the union `export type Phase = typeof PhaseLobby | ...` (enum_style: union).
#     EventType's constants (EventGameStarted, ...) do not carry the type name as
#     prefix, so tygo cannot group them: they stay `EventType = string` plus
#     typed consts. internal/protocol uses plain consts (the union style would
#     emit unions named Type/Event/Err/Close and clash with game.Event).
#   * Time constants are expressed in milliseconds (see time.Second below);
#     time.Duration *fields* would be nanoseconds, as encoding/json writes them.
#   * Cross-package references (game.View, game.Avatar, game.EventType) are
#     mapped per package and imported through the frontmatter.
type_mappings:
  time.Time: "string /* RFC 3339 / ISO 8601 */"
  time.Duration: "number /* nanoseconds */"
  time.Millisecond: "1 /* ms */"
  time.Second: "1000 /* ms */"
  time.Minute: "60000 /* ms */"
  time.Hour: "3600000 /* ms */"
  json.RawMessage: "unknown"

packages:
  - path: "github.com/AresiusXP/tutti-frutti/server/internal/protocol"
    output_path: "../web/src/lib/protocol/protocol.ts"
    fallback_type: unknown
    type_mappings:
      game.Avatar: "Avatar"
      game.EventType: "EventType"
      game.View: "View"
    frontmatter: |
      // Generated by `cd server && go tool tygo generate` from internal/protocol.
      // Do not edit this file by hand: change the Go types and regenerate.
      import type { Avatar, EventType, View } from './game';
  - path: "github.com/AresiusXP/tutti-frutti/server/internal/game"
    output_path: "../web/src/lib/protocol/game.ts"
    fallback_type: unknown
    enum_style: union
    preserve_comments: types
    exclude_files:
      - errors.go
    frontmatter: |
      // Generated by `cd server && go tool tygo generate` from internal/game.
      // Do not edit this file by hand: change the Go types and regenerate.
  - path: "github.com/AresiusXP/tutti-frutti/server/internal/catalog"
    output_path: "../web/src/lib/protocol/catalog.ts"
    fallback_type: unknown
    preserve_comments: types
    frontmatter: |
      // Generated by `cd server && go tool tygo generate` from internal/catalog.
      // Do not edit this file by hand: change the Go types and regenerate.
