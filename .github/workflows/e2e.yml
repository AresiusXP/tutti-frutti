# End-to-end tests: the Playwright suite in e2e/ against the real docker compose stack
# (Postgres + Go server + nginx web + a Caddy edge standing in for Traefik).
# Runs on pull requests that touch what the stack is made of, and on demand.

name: E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "e2e/**"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The compose project of the stack (its `name:`): the restart test runs `docker compose -p $E2E_COMPOSE_PROJECT restart server`.
  E2E_COMPOSE_PROJECT: tutti-frutti
  E2E_BASE_URL: http://localhost:8000

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Lint the suite (prettier, eslint, tsc)
        working-directory: e2e
        run: npm run lint

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers and system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system libraries (browsers came from the cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same cache scopes as docker-build.yml, so a pull request that already built the images there starts warm.
      # The tags are the names docker compose gives the images of this project (`docker compose config --images`).
      - name: Build the server image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          load: true
          tags: tutti-frutti-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          load: true
          tags: tutti-frutti-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Start the stack
        run: docker compose up -d --no-build --wait

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      - name: Show compose logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=300

      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v
