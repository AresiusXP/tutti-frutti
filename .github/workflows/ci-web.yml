# CI for the SvelteKit web app.
# Triggered only when files under web/ (or this workflow) change.

name: CI — Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      # Built-output assertions (CSP hashes vs build/index.html, manifest) only run
      # once build/ exists; before the build they are skipped.
      - name: Security headers and PWA checks against the build
        run: npx vitest run src/lib/security.test.ts src/lib/pwa.test.ts

      - name: Dev playground must not ship in production bundles
        run: |
          if grep -rlE "__tfSession|scenarios\.(play|lobby|review)" build/_app; then
            echo "::error::dev playground code leaked into the production build (see src/routes/dev/+page.ts)"
            exit 1
          fi
