# CI for the Helm chart.
# Triggered when files under helm/ change, or the Go sources / design doc the observability
# consistency test reads (registered metric names, the metrics and alerts tables), or this workflow.

name: CI — Helm

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      # the dashboard/alert consistency test reads the registered metrics and the metrics table
      - "server/internal/**"
      - "docs/DESIGN.md"
      - ".github/workflows/ci-helm.yml"
  pull_request:
    branches: [main]
    paths:
      - "helm/**"
      # the dashboard/alert consistency test reads the registered metrics and the metrics table
      - "server/internal/**"
      - "docs/DESIGN.md"
      - ".github/workflows/ci-helm.yml"

concurrency:
  group: ci-helm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CHART_PATH: helm/tutti-frutti
  HELM_VERSION: v3.18.4
  KUBECONFORM_VERSION: v0.8.0
  KUBERNETES_VERSION: 1.30.0
  PROMETHEUS_VERSION: 3.14.0
  PROMETHEUS_SHA256: f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/kubeconform" -v

      # promtool validates and unit-tests the alert rules (ci/check-observability.sh).
      - name: Install promtool
        run: |
          curl -sSfL -o "$RUNNER_TEMP/prometheus.tar.gz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          "$RUNNER_TEMP/promtool" --version

      - name: helm lint
        run: helm lint "$CHART_PATH"

      - name: helm template
        run: helm template t "$CHART_PATH" > /dev/null

      # ServiceMonitor is a CRD without a bundled schema, hence -ignore-missing-schemas.
      - name: kubeconform (default values)
        run: |
          helm template t "$CHART_PATH" \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -summary

      - name: kubeconform (all optional resources enabled)
        run: |
          helm template t "$CHART_PATH" \
            --set serviceMonitor.enabled=true \
            --set dashboard.enabled=true \
            --set prometheusRule.enabled=true \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -summary

      - name: Observability checks (dashboard drift, alert rules)
        run: PROMTOOL="$RUNNER_TEMP/promtool" "$CHART_PATH/ci/check-observability.sh"
