# CI for the Go server.
# Triggered only when files under server/, the generated TypeScript protocol
# types (web/src/lib/protocol/) or this workflow change. The generated types are
# part of the trigger so that a hand edit of them is caught by the drift check.

name: CI — Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/src/lib/protocol/**"
      - ".github/workflows/ci-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "web/src/lib/protocol/**"
      - ".github/workflows/ci-server.yml"

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Postgres for the store's integration tests (TEST_DATABASE_URL below).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutti
          POSTGRES_PASSWORD: tutti
          POSTGRES_DB: tutti
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutti -d tutti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # staticcheck is installed at @latest, so the cached binary is refreshed
      # weekly (and whenever the Go version changes).
      - name: Compute staticcheck cache key
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache staticcheck
        id: staticcheck-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin/staticcheck
          key: staticcheck-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ steps.week.outputs.week }}

      - name: Install staticcheck
        if: steps.staticcheck-cache.outputs.cache-hit != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: ~/go/bin/staticcheck ./...

      # The TypeScript protocol types are generated from the Go wire types
      # (server/tygo.yaml). Regenerate them and fail if the checked-in files
      # differ: `git status --porcelain` also catches new or deleted files.
      - name: Check generated protocol types are up to date
        run: |
          go tool tygo generate
          if [ -n "$(git status --porcelain -- ../web/src/lib/protocol)" ]; then
            echo "::error title=Generated protocol types are stale::web/src/lib/protocol/ is out of date with the Go wire types. Run 'cd server && go tool tygo generate' and commit the result. Never edit those files by hand."
            git status --short -- ../web/src/lib/protocol
            git diff -- ../web/src/lib/protocol
            exit 1
          fi

      - name: go test
        env:
          TEST_DATABASE_URL: postgres://tutti:tutti@localhost:5432/tutti?sslmode=disable
        run: go test -race ./...

      - name: go build
        run: go build ./...
