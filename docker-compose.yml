name: tutti-frutti

# Local dev / e2e stack: http://localhost:8000 (override with EDGE_PORT / POSTGRES_PORT
# and `docker compose -p <project>` to run several stacks side by side)
#   edge (Caddy, mimics Traefik path routing) -> web (/) and server (/api, /ws)
#   server -> postgres
#
# Optional Google login: export GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET before `up`.
# Optional AI judge: export CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN too.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tutti
      POSTGRES_PASSWORD: tutti
      POSTGRES_DB: tutti
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps the cluster in /var/lib/postgresql/<major>/docker, so the volume
      # goes on /var/lib/postgresql. A volume made by an older major is refused ("in 18+, these
      # Docker images are configured..."): `docker compose down -v` once to start over.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutti -d tutti"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: "8080"
      LOG_LEVEL: debug
      PUBLIC_URL: http://localhost:${EDGE_PORT:-8000}
      # Automatic public-room bot additions; false leaves existing bots playing.
      PUBLIC_BOTS_ENABLED: "${PUBLIC_BOTS_ENABLED:-true}"
      PUBLIC_BOTS_MAX: "${PUBLIC_BOTS_MAX:-2}"
      PUBLIC_BOTS_FIRST_MIN_SECONDS: "${PUBLIC_BOTS_FIRST_MIN_SECONDS:-20}"
      PUBLIC_BOTS_FIRST_MAX_SECONDS: "${PUBLIC_BOTS_FIRST_MAX_SECONDS:-30}"
      PUBLIC_BOTS_SECOND_MIN_SECONDS: "${PUBLIC_BOTS_SECOND_MIN_SECONDS:-40}"
      PUBLIC_BOTS_SECOND_MAX_SECONDS: "${PUBLIC_BOTS_SECOND_MAX_SECONDS:-55}"
      DATABASE_URL: postgres://tutti:tutti@postgres:5432/tutti?sslmode=disable
      SESSION_SECRET: dev-only-session-secret-do-not-use-in-production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Optional AI judge (needs Google login to be offered to the host).
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web

  edge:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${EDGE_PORT:-8000}:8000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server
      - web
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8081/web && wget -q -O /dev/null http://127.0.0.1:8081/server
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
