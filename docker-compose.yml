name: tutti-frutti

# Local dev / e2e stack: http://localhost:8000
#   edge (Caddy, mimics Traefik path routing) -> web (/) and server (/api, /ws)
#   server -> postgres
#
# Optional Google login: export GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET before `up`.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tutti
      POSTGRES_PASSWORD: tutti
      POSTGRES_DB: tutti
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutti -d tutti"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: "8080"
      LOG_LEVEL: debug
      PUBLIC_URL: http://localhost:8000
      DATABASE_URL: postgres://tutti:tutti@postgres:5432/tutti?sslmode=disable
      SESSION_SECRET: dev-only-session-secret-do-not-use-in-production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web

  edge:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server
      - web
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8081/web && wget -q -O /dev/null http://127.0.0.1:8081/server
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
