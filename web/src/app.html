<!doctype html>
<html lang="es" translate="no">
	<head>
		<meta charset="utf-8" />
		<!-- The game has its own ES/EN/NL switch; a browser translation would also rewrite the players'
		     answers and categories (and covers the header in the Android app on first launch). -->
		<meta name="google" content="notranslate" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<!-- The brand is a fixed constant (src/lib/brand.ts); a test keeps these in sync. -->
		<title>Tutti Frutti</title>
		<meta name="application-name" content="Tutti Frutti" />
		<meta name="apple-mobile-web-app-title" content="Tutti Frutti" />
		<meta property="og:title" content="Tutti Frutti" />
		<meta property="og:site_name" content="Tutti Frutti" />
		<meta property="og:type" content="website" />
		<!--
			Link previews (Discord, WhatsApp, Telegram, ...): crawlers do not run JavaScript, so this
			must live in the static shell. Always Spanish (the base language), and the image URL must be
			absolute. No og:url: invite links such as /KT7P get this same shell and must not all
			claim the home page as their canonical URL.
		-->
		<meta
			property="og:description"
			content="El Tutti Frutti de toda la vida, online y en tiempo real. Armá una sala, pasales el código a tus amigos y jueguen desde el celu, sin lapicera ni papel."
		/>
		<meta property="og:locale" content="es_AR" />
		<meta property="og:image" content="https://tuttifrutti.aresius.xyz/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Naranja, frutilla y lima junto al nombre Tutti Frutti" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="theme-color" content="#1a1033" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/logo.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="off">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
