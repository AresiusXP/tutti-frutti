# Security headers shared by every location.
#
# nginx pitfall: `add_header` directives are only inherited from the enclosing
# level when the current level defines NO add_header of its own. Locations that
# set Cache-Control therefore `include` this file again instead of relying on
# the server-level copy.
#
# TODO(Phase 5): add a strict Content-Security-Policy. SvelteKit's SPA
# fallback ships one small inline bootstrap <script> in index.html, so the policy
# needs a hash (or nonce) for it. HSTS belongs on the TLS-terminating ingress.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
