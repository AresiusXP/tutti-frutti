# Security headers shared by every location.
#
# nginx pitfall: `add_header` directives are only inherited from the enclosing
# level when the current level defines NO add_header of its own. Locations that
# set Cache-Control therefore `include` this file again instead of relying on
# the server-level copy.
#
# Content-Security-Policy (why each directive: docs/DESIGN.md, "Security headers and PWA"):
#   script-src      'self' + the sha256 of the shell's single inline bootstrap script
#                   ($tf_script_hashes, generated per build): no 'unsafe-inline', no 'unsafe-eval'
#   style-src       'self' only: Tailwind ships one external CSS file and Svelte sets styles through
#                   the CSSOM (`style:` directives), which CSP does not restrict
#   style-src-attr  hashes of the static inline style attributes the app renders: the shell's
#                   <div style="display: contents"> and SvelteKit's route announcer
#                   ($tf_style_attr_hashes, generated per build)
#   connect-src     'self' + ws(s)://<request host> ($tf_ws_sources, see nginx.conf)
#   upgrade-insecure-requests is appended only for requests that arrived over https
# The policy must stay on ONE line (a newline would end up inside the header value).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $tf_script_hashes; style-src 'self'; style-src-attr 'unsafe-hashes' $tf_style_attr_hashes; img-src 'self'; font-src 'self'; connect-src 'self' $tf_ws_sources; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'$tf_csp_upgrade" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Denied: everything the app does not use. Features not listed stay allowed to this origin only
# (their default): Wake Lock (Playing screen), Web Share and clipboard writes (invite); vibration is
# not a policy-controlled feature. Only names Chromium recognises are listed (unknown ones log a
# console warning).
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), screen-wake-lock=(self), clipboard-write=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# HSTS only on https requests (see $tf_hsts in nginx.conf); no includeSubDomains / preload.
add_header Strict-Transport-Security $tf_hsts always;
