# Static SPA (SvelteKit adapter-static, fallback: index.html) behind Traefik.
# /api/* and /ws are routed to the Go server by the ingress, never here.

# Hashes of the shell's inline bootstrap script / style attributes ($tf_script_hashes,
# $tf_style_attr_hashes), generated from build/index.html at image build time (scripts/csp.mjs).
include /etc/nginx/snippets/csp-hashes.conf;

# Per-request pieces of the security headers (nginx-security-headers.conf). TLS ends at the
# ingress, so "was this request https?" comes from X-Forwarded-Proto (Traefik always sets it;
# the compose edge sends "http"). An empty value makes `add_header` skip the header.
map $http_x_forwarded_proto $tf_hsts {
    default "";
    ~*^https "max-age=31536000";
}
map $http_x_forwarded_proto $tf_csp_upgrade {
    default "";
    ~*^https "; upgrade-insecure-requests";
}
# The page and the WebSocket share one host, but Safari has historically not matched ws(s):
# with 'self' in connect-src, so the request's own host is named explicitly. Only a plain
# host[:port] is ever interpolated (anything else, e.g. an IPv6 literal, falls back to 'self').
map $http_host $tf_ws_sources {
    default "";
    "~*^(?<h>[a-z0-9][a-z0-9.-]*(?::[0-9]{1,5})?)$" "ws://$h wss://$h";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        image/x-icon;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok";
    }

    # The whole backend namespace (/api, /api/..., /ws, /ws/...) belongs to the
    # Go server behind the ingress. If a request ever reaches this container it
    # must be a clean JSON 404, never the SPA fallback (HTML). One boundary-matched
    # regex so that /api and /ws/x are covered but SPA routes like /apix are not.
    # It is declared before the other regex locations because the first match wins
    # (otherwise /api/x.png would be served by the image rule).
    location ~ ^/(?:api|ws)(?:/|$) {
        # Empty types{}: otherwise a URL like /api/x.png would label the JSON as image/png.
        types { }
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 404 '{"error":"not_found"}';
    }

    # The app shell and everything that controls updates must always be
    # revalidated, otherwise clients can get stuck on an old service worker.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ ^/(?:sw\.js|workbox-[^/]+\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The stock mime.types has no entry for the web app manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Content-hashed build output. No `always` on these two Cache-Control headers: a 404
    # (e.g. a chunk of another version during a rolling deploy) must never be cached, least of all
    # as "immutable" for a year.
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Icons and images are not fingerprinted: cache for a day.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The privacy policy is a static page of its own (privacy.html + privacy.css: plain HTML, no
    # script, no inline style), served at /privacy (the URL to link; a trailing slash and the file
    # name work too). Always revalidated, so a corrected policy is never served stale. Declared
    # before the SPA fallback, otherwise /privacy would get index.html.
    location ~ ^/privacy(?:/|\.html)?$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /privacy.html =404;
    }

    location = /privacy.css {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Digital Asset Links: the Android app (Trusted Web Activity, package xyz.aresius.tuttifrutti)
    # is verified against this file, fetched over https without following redirects. It must be
    # served as JSON, revalidated every time (a rotated signing key takes effect at once) and
    # never come from the SPA fallback: a missing file is a genuine 404, never index.html.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Nothing else lives under /.well-known/: an unknown path is a 404, not the app shell.
    location ^~ /.well-known/ {
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 404 "not found\n";
    }

    # SPA fallback: deep links such as /KT7P (invite links) get index.html.
    location / {
        try_files $uri /index.html;
    }
}
