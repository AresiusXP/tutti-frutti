{{- if .Values.ingress.enabled -}}
{{- $server := include "tutti-frutti.componentFullname" (dict "component" "server" "context" .) -}}
{{- $web := include "tutti-frutti.componentFullname" (dict "component" "web" "context" .) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tutti-frutti.fullname" . }}
  labels:
    {{- include "tutti-frutti.labels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ default (printf "%s-tls" .Values.ingress.host) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $server }}
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ $server }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $web }}
                port:
                  name: http
{{- end }}
