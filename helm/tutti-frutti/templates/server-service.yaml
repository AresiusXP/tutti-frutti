apiVersion: v1
kind: Service
metadata:
  name: {{ include "tutti-frutti.componentFullname" (dict "component" "server" "context" .) }}
  labels:
    {{- include "tutti-frutti.componentLabels" (dict "component" "server" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "tutti-frutti.selectorLabels" (dict "component" "server" "context" .) | nindent 4 }}
