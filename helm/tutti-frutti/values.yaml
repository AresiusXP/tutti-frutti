# Default values for the Tutti Frutti chart (web + server + ingress).
# Both images default to the chart's appVersion, so one chart version always
# deploys one matching server/web pair (they share the WebSocket protocol).

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Applied to both pods. ndots=1 avoids search-domain lookups for external
# names (Google OIDC endpoints).
dnsConfig:
  options:
    - name: ndots
      value: "1"

nodeSelector: {}
tolerations: []
affinity: {}

# Hardening applied to both containers. The pod-level user is set per component.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---------------------------------------------
# Server (Go: REST /api, WebSocket /ws)
# ---------------------------------------------
# Always exactly one replica with strategy Recreate: authoritative game state
# lives in memory, so there is intentionally no replicaCount value and NO
# autoscaling (an HPA would split the rooms across pods). Scale it vertically
# (resources, maxRooms) instead.
server:
  image:
    repository: ghcr.io/aresiusxp/tutti-frutti-server
    # Empty = .Chart.AppVersion
    tag: ""
    pullPolicy: IfNotPresent
  logLevel: info
  # Empty = https://<ingress.host> (http:// when ingress.tls.enabled=false).
  publicUrl: ""
  # Upper bound of live game rooms held in memory (MAX_ROOMS).
  maxRooms: 1000
  # Public games (PUBLIC_ROOMS_ENABLED). false keeps them off across restarts,
  # for an owner who cannot moderate for a while (docs/MODERATION.md,
  # "Absence"): nobody can create or newly join a public room, the directory
  # says public games are paused and no new bot is added (bots already seated
  # keep playing); players already seated finish their game and private rooms
  # are unaffected. `moderate public enable|disable` flips it at run time, in
  # memory only.
  publicRooms:
    enabled: true
  # Automatic bot fill for public rooms. Disable new additions for rollback;
  # existing bots keep playing. max is 1..2 (use enabled=false to disable).
  publicBots:
    enabled: true
    max: 2
    # Seconds since waiting started: each 1..300, min <= max,
    # and secondMinSeconds must exceed firstMaxSeconds.
    firstMinSeconds: 20
    firstMaxSeconds: 30
    secondMinSeconds: 40
    secondMaxSeconds: 55
  # Take the rate-limit client IP from the rightmost X-Forwarded-For entry
  # (TRUST_FORWARDED_FOR). Only enable when exactly one trusted proxy hop
  # appends the header. Behind a Traefik Service with
  # externalTrafficPolicy=Cluster every client shares one SNAT'd IP anyway.
  trustForwardedFor: false
  # Extra browser origins allowed to call the API/WebSocket besides the public
  # URL (ALLOWED_ORIGINS), e.g. a dev frontend. Empty in production.
  allowedOrigins: []
  # AI judge of the review (Cloudflare Workers AI, Free plan). It is on only when
  # the Secret has cloudflare-account-id and cloudflare-api-token. The Free plan
  # gives 10000 Neurons a day and Cloudflare refuses the call after that (it is
  # never billed unless the account is upgraded to Workers Paid, so never add a
  # payment method to that account); the server keeps to dailyNeurons (1..10000).
  judge:
    dailyNeurons: 9000
  # The operator's moderation tool (docs/MODERATION.md): the server listens on this
  # Unix socket (mode 0600, the server's own user) and the owner runs
  # `kubectl exec deploy/<server> -- /moderate status`. The directory is mounted as
  # an emptyDir, which stays writable with readOnlyRootFilesystem. Empty disables it.
  moderation:
    socket: /run/tutti/moderation.sock
  # Extra env entries (list of EnvVar objects).
  extraEnv: []
  # Existing Secret, not created by this chart:
  #   kubectl create secret generic tutti-frutti-secrets \
  #     --from-literal=database-url='postgres://user:pass@host:5432/tuttifrutti?sslmode=disable' \
  #     --from-literal=session-secret="$(openssl rand -base64 32)" \
  #     --from-literal=google-client-id='<id>' \
  #     --from-literal=google-client-secret='<secret>' \
  #     --from-literal=cloudflare-account-id='<id>' \
  #     --from-literal=cloudflare-api-token='<Workers AI token>'
  secrets:
    existingSecret: tutti-frutti-secrets
    # Phase 0 placeholder deploys start without the Secret. Set to false once
    # the server really needs it (database, sessions, Google login).
    optional: true
    keys:
      databaseUrl: database-url
      sessionSecret: session-secret
      googleClientId: google-client-id
      googleClientSecret: google-client-secret
      cloudflareAccountId: cloudflare-account-id
      cloudflareApiToken: cloudflare-api-token
  service:
    type: ClusterIP
    port: 8080
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    # Makes the group of the moderation emptyDir the server's own, so the control
    # socket directory is writable by it however the node's kubelet sets the mode
    # (it is 0777 by default; this does not depend on it).
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# ---------------------------------------------
# Web (static SvelteKit build on nginx-unprivileged)
# ---------------------------------------------
web:
  # Fixed replica count; only used when web.autoscaling.enabled=false (with the
  # HPA on, the Deployment omits `replicas` so Helm/ArgoCD do not fight the HPA).
  replicaCount: 1
  # HorizontalPodAutoscaler for the stateless nginx pods (needs metrics-server).
  # The CPU utilization is measured against web.resources.requests.cpu.
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80
  image:
    repository: ghcr.io/aresiusxp/tutti-frutti-web
    # Empty = .Chart.AppVersion
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 128Mi

# ---------------------------------------------
# Ingress (Traefik + cert-manager + external-dns/Pi-hole)
# ---------------------------------------------
# Only /api and /ws go to the server and everything else to web.
# /metrics, /healthz and /readyz are deliberately NOT exposed.
ingress:
  enabled: true
  className: traefik
  host: tuttifrutti.aresius.xyz
  # external-dns needs BOTH the annotation and the label to register the record.
  # The homelab deployment sets both to "none" (argocd-apps values/tutti-frutti.yaml): the public game must
  # resolve to Cloudflare on the home LAN too, because Android 17 blocks Chrome from private IPs without the
  # "Nearby devices" permission (docs/ANDROID.md, section 8).
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.aresius.xyz: pihole
    ingress.kubernetes.io/force-hsts: "true"
  labels:
    external-dns.aresius.xyz: pihole
  tls:
    enabled: true
    # Empty = <host>-tls
    secretName: tuttifrutti.aresius.xyz-tls

# ---------------------------------------------
# Prometheus Operator ServiceMonitor (scrapes the server /metrics)
# ---------------------------------------------
serviceMonitor:
  enabled: false
  interval: 30s
  labels:
    release: kube-prometheus-stack

# ---------------------------------------------
# Grafana dashboard (ConfigMap picked up by the Grafana sidecar)
# ---------------------------------------------
# The dashboard (uid tutti-frutti) is generated by dashboards/generate.py and
# shipped in dashboards/tutti-frutti.json. It needs the Prometheus Operator
# scrape (serviceMonitor.enabled) to have data.
dashboard:
  enabled: false
  # The homelab kube-prometheus-stack sidecar loads every ConfigMap labelled
  # grafana_dashboard=1 from ALL namespaces (LABEL / LABEL_VALUE / NAMESPACE=ALL).
  labels:
    grafana_dashboard: "1"
  # Only used when the sidecar sets FOLDER_ANNOTATION (not the case in the
  # homelab, where dashboards land in "General"). kube-prometheus-stack calls it
  # grafana_folder, e.g. {grafana_folder: Games}.
  annotations: {}

# ---------------------------------------------
# Prometheus Operator PrometheusRule (alerts)
# ---------------------------------------------
# Needs the Prometheus Operator CRD, the ServiceMonitor (serviceMonitor.enabled)
# and kube-state-metrics + cAdvisor (restart, readiness and memory alerts).
prometheusRule:
  enabled: false
  # The homelab Prometheus only loads rules labelled release=kube-prometheus-stack
  # (ruleSelector); its ruleNamespaceSelector is empty (all namespaces).
  labels:
    release: kube-prometheus-stack
  # Annotations of the PrometheusRule object itself.
  annotations: {}
  # Evaluation interval of the rule groups; empty = Prometheus default (30s).
  interval: ""
  # Added to every alert next to severity (e.g. {team: games}).
  additionalRuleLabels: {}
  # Added to every alert next to summary/description/runbook.
  additionalRuleAnnotations: {}
  # runbook_url annotation of every alert; empty = omit.
  runbookUrl: https://github.com/AresiusXP/tutti-frutti/blob/main/docs/DESIGN.md#observability-phase-5
